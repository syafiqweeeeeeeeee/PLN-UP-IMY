# Compose DEVELOPMENT saja — jangan dipakai di produksi.
# Produksi memakai docker-compose.prod.yml (tanpa bind mount, tanpa port
# publik, non-root, volume persisten).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # vendor diambil dari image, bukan dari host, agar fresh clone langsung jalan
      - vendor_vol:/app/vendor
    environment:
      - SERVER_NAME=:8000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pln_up_imy
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      # Hanya untuk dev lokal. Di produksi MySQL tidak boleh di-publish.
      # 3307 di host karena 3306 dipakai MySQL Laragon; koneksi antar-container tetap 3306
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Hanya dipakai saat volume dbdata masih kosong; mengganti nama di sini
      # tidak me-rename database yang sudah ada.
      MYSQL_DATABASE: pln_up_imy
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      # Terhubung ke service MySQL "db" pada jaringan compose (port 3306 antar-container)
      PMA_HOST: db
      # Batas import dump SQL besar supaya tidak timeout
      UPLOAD_LIMIT: 300M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: "600"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  vendor_vol:
