; Override PHP untuk image produksi (tidak dipakai target development).
expose_php = Off
memory_limit = 256M

; Kode tidak berubah di dalam image yang sudah di-build, jadi validasi
; timestamp opcache bisa dimatikan. Setiap release = image baru.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
