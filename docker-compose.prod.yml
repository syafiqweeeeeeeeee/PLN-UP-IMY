# Compose PRODUKSI (on-premises / Coolify VM).
#
# Berbeda dari docker-compose.yml (dev): tidak ada bind mount kode, tidak ada
# port yang di-publish ke host (semua trafik lewat proxy Coolify/Traefik),
# MySQL tidak terbuka ke jaringan luar, dan image berjalan sebagai non-root.
#
# Pakai:
#   cp .env.example .env        # lalu isi nilai produksi (JANGAN commit .env)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Variabel wajib (diisi di Coolify Environment Variables atau .env VM):
#   APP_KEY, APP_URL, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_ROOT_PASSWORD
# Nilai rahasia tidak pernah ditulis di file ini.
name: ep-ppid-prod

services:
  app:
    build:
      context: .
      target: production
    image: ep-ppid:${IMAGE_TAG:-local}
    restart: unless-stopped
    # Hanya di jaringan internal compose; Coolify/Traefik mem-proxy ke 8000.
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME:-E-PPID PLN}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi — hasil `php artisan key:generate --show`}
      APP_URL: ${APP_URL:?APP_URL wajib diisi, mis. https://ppid.internal.contoh.id}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: id_ID

      # Log ke stdout/stderr supaya terbaca `docker logs` / Coolify.
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${APP_NAME:-E-PPID PLN}

      # Migrasi dijalankan entrypoint hanya bila true; review dulu migrasinya.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-10}
      MIGRATION_RETRY_DELAY: ${MIGRATION_RETRY_DELAY:-5}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Upload dokumen tamu (KTP/surat), galeri, dan file privat aplikasi.
      # Tanpa volume ini data hilang setiap container dibuat ulang.
      - app_storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

  db:
    # Versi runtime di-pin ke major 8.0, bukan `latest`.
    image: mysql:8.0
    restart: unless-stopped
    # SENGAJA tanpa `ports:` — MySQL hanya di jaringan internal compose.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # CMD-SHELL agar `$$` diekspansi menjadi $ dan password benar-benar
      # dibaca dari environment container.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  app_storage:
  db_data:
